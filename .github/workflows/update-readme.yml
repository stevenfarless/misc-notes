name: Update README tree and tag index

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate file tree and update README
        run: python3 .github/scripts/build_tree.py

      - name: Generate tag index
        run: python3 .github/scripts/build_tags.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md TAGS.md
          git diff --cached --quiet || git commit -m "chore: auto-update README and TAGS"
          git push
