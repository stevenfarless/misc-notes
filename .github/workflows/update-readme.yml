name: Build indexes and deploy reader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README file tree
        run: python3 .github/scripts/build_tree.py

      - name: Generate tag index
        run: python3 .github/scripts/build_tags.py

      - name: Generate browser article manifest
        run: python3 .github/scripts/build_manifest.py

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md TAGS.md articles.json
          git diff --cached --quiet || git commit -m "chore: update generated indexes"
          git push

      - name: Prepare static website
        run: python3 .github/scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
